<title>寶寶副食品紀錄</title>
<style>
  :root {
    --bg: #faf3e8;
    --surface: #fffdf8;
    --surface-2: #f3e9d8;
    --ink: #5b4636;
    --ink-soft: #8a7862;
    --ink-faint: #b3a48d;
    --line: #e6dac6;
    --accent: #c98a4b;
    --accent-ink: #7a5326;
    --accent-soft: #f0dfc3;
    --good: #6f9d74;
    --good-soft: #e3ede2;
    --warn: #d98a4f;
    --warn-soft: #f6e6d4;
    --danger: #c2604a;
    --danger-soft: #f5ded7;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 6px 18px -8px rgba(91, 70, 54, 0.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241c15; --surface: #2f251c; --surface-2: #3a2d20; --ink: #f2e7d8; --ink-soft: #c2af97;
      --ink-faint: #8d7a63; --line: #4a3b2c; --accent: #e3a868; --accent-ink: #ffe4bb; --accent-soft: #4a3722;
      --good: #8fbb94; --good-soft: #2c352c; --warn: #e0a26a; --warn-soft: #3c3122; --danger: #e08b74; --danger-soft: #3d2a24;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241c15; --surface: #2f251c; --surface-2: #3a2d20; --ink: #f2e7d8; --ink-soft: #c2af97;
    --ink-faint: #8d7a63; --line: #4a3b2c; --accent: #e3a868; --accent-ink: #ffe4bb; --accent-soft: #4a3722;
    --good: #8fbb94; --good-soft: #2c352c; --warn: #e0a26a; --warn-soft: #3c3122; --danger: #e08b74; --danger-soft: #3d2a24;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #faf3e8; --surface: #fffdf8; --surface-2: #f3e9d8; --ink: #5b4636; --ink-soft: #8a7862;
    --ink-faint: #b3a48d; --line: #e6dac6; --accent: #c98a4b; --accent-ink: #7a5326; --accent-soft: #f0dfc3;
    --good: #6f9d74; --good-soft: #e3ede2; --warn: #d98a4f; --warn-soft: #f6e6d4; --danger: #c2604a; --danger-soft: #f5ded7;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }
  h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 700; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  .app { max-width: 860px; margin: 0 auto; padding: 18px 16px 64px; }

  /* ---------- Header ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .brand-title { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .brand-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .baby-switch { position: relative; }
  .baby-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer; box-shadow: var(--shadow); color: var(--ink); font-size: 13.5px; font-weight: 600; }
  .tour-start-btn { border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); height: 34px; padding: 0 13px 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; flex-shrink: 0; font-size: 12.5px; font-weight: 700; white-space: nowrap; animation: tourPulse 2.2s ease-in-out 3; }
  .tour-start-btn:hover { background: var(--accent); color: #fff; }
  .tour-start-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  @keyframes tourPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(201, 138, 75, .45); } 50% { box-shadow: 0 0 0 6px rgba(201, 138, 75, 0); } }
  @media (prefers-reduced-motion: reduce) { .tour-start-btn { animation: none; } }
  .tour-overlay { position: fixed; inset: 0; z-index: 500; pointer-events: none; display: none; }
  .tour-spotlight { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(20, 14, 8, .62); border: 2px solid var(--accent); pointer-events: none; transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease; }
  .tour-tooltip { position: fixed; width: min(320px, calc(100vw - 24px)); background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 16px; pointer-events: auto; transition: top .25s ease, left .25s ease; }
  .tour-tooltip-step { font-size: 11px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); display: inline-block; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .tour-tooltip-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: var(--ink); }
  .tour-tooltip-text { font-size: 13px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 14px; }
  .tour-tooltip-text ul { margin: 6px 0; padding-left: 18px; }
  .tour-tooltip-text li { margin-bottom: 4px; }
  .tour-tooltip-actions { display: flex; align-items: center; gap: 8px; }
  .baby-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
  .baby-chevron { color: var(--ink-faint); font-size: 10px; margin-left: 2px; }
  .baby-dropdown { position: absolute; right: 0; top: calc(100% + 8px); width: 232px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 8px; z-index: 40; display: none; }
  .baby-dropdown.open { display: block; }
  .baby-option { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .baby-option:hover { background: var(--surface-2); }
  .baby-option.active { background: var(--accent-soft); color: var(--accent-ink); }
  .baby-dropdown-divider { height: 1px; background: var(--line); margin: 6px 2px; }
  .baby-dropdown-action { display: grid; grid-template-columns: 20px 1fr; align-items: center; column-gap: 9px; padding: 8px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .baby-dropdown-action svg { width: 16px; height: 16px; justify-self: center; }
  .baby-dropdown-action:hover { background: var(--surface-2); color: var(--ink); }

  /* ---------- Tabs ---------- */
  .tabbar { display: flex; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 999px; margin-bottom: 20px; overflow-x: auto; }
  .tab-btn { flex: 1; white-space: nowrap; border: none; background: transparent; color: var(--ink-soft); padding: 11px 12px; border-radius: 999px; font-size: 15.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: background .15s, color .15s; }
  .tab-btn.active { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }
  .tab-icon { width: 21px; height: 21px; flex-shrink: 0; }

  .panel { display: none; }
  .panel.active { display: block; animation: fadein .18s ease; }
  @media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .section-icon { width: 18px; height: 18px; flex-shrink: 0; }
  .card-sub { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 14px; }

  .btn { border: none; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--ink); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .icon-choice:focus-visible, .baby-pill:focus-visible, .food-option:focus-visible, .month-cell:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* ---------- Calendar controls ---------- */
  .cal-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .cal-view-toggle { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
  .cal-view-btn { border: none; background: transparent; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .cal-view-btn.active { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-nav-btn { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--ink); font-size: 14px; }
  .cal-label { font-size: 13.5px; font-weight: 800; min-width: 128px; text-align: center; font-variant-numeric: tabular-nums; }
  .cal-today-btn { font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border: none; border-radius: 999px; padding: 7px 12px; cursor: pointer; }

  /* ---------- Day list (day/week views) ---------- */
  .day-list { display: flex; flex-direction: column; gap: 10px; }
  .day-row { display: flex; align-items: stretch; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow); }
  .day-row.is-today { border-color: var(--accent); }
  .day-date { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 50px; color: var(--ink-soft); flex-shrink: 0; }
  .day-date .dow { font-size: 11px; font-weight: 700; }
  .day-date .num { font-size: 19px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .day-row.is-today .day-date .num { color: var(--accent-ink); }
  .day-date .mon { font-size: 10px; color: var(--ink-faint); }
  .day-chips { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  .day-chip { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; border: 1px solid transparent; color: var(--ink); max-width: 100%; overflow-x: auto; }
  .day-chip:hover { border-color: var(--line); }
  .chip-foods-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
  .chip-food-mini { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .chip-food-mini svg { width: 17px; height: 17px; flex-shrink: 0; }
  .chip-status-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; padding-left: 6px; border-left: 1px solid var(--line); }
  .chip-status-row svg { width: 15px; height: 15px; flex-shrink: 0; }
  .day-empty-hint { font-size: 12px; color: var(--ink-faint); }
  .day-add-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed var(--line); background: transparent; color: var(--ink-soft); font-size: 17px; cursor: pointer; align-self: center; }
  .day-add-btn:hover { border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- Month grid ---------- */
  .month-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .month-dow { text-align: center; font-size: 11px; font-weight: 800; color: var(--ink-faint); }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 5px; min-height: 72px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .month-cell:hover { border-color: var(--accent); }
  .month-cell.is-today { border-color: var(--accent); background: var(--accent-soft); }
  .month-cell.is-outside { opacity: .38; }
  .month-cell-num { font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .month-cell.is-today .month-cell-num { color: var(--accent-ink); }
  .month-food-line { display: flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .month-food-line svg { width: 10px; height: 10px; flex-shrink: 0; }
  .month-food-count { color: var(--ink-faint); font-weight: 600; font-variant-numeric: tabular-nums; }
  .month-cell-more { font-size: 8.5px; color: var(--ink-faint); font-weight: 700; }

  /* ---------- Modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(40, 30, 20, .38); display: flex; align-items: flex-end; justify-content: center; z-index: 100; animation: fadein .15s ease; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-box { background: var(--surface); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; overflow-x: hidden; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .modal-box.wide { max-width: 760px; }
  @media (min-width: 640px) { .modal-box { border-radius: var(--radius-lg); box-shadow: var(--shadow); } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 14px; position: sticky; top: 0; background: var(--surface); z-index: 5; border-radius: inherit; }
  .modal-body { padding: 0 20px 20px; }
  .modal-title { font-size: 16px; font-weight: 800; }
  .modal-close { border: none; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; color: var(--ink-soft); font-size: 15px; cursor: pointer; }

  .field { margin-bottom: 16px; }
  .field-label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; }
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .field select { height: 52px; padding: 0 14px; line-height: 52px; -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 20px) center, calc(100% - 15px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  .mode-toggle { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
  .mode-btn { flex: 1; border: none; background: transparent; padding: 9px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .mode-btn.active { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }

  .choice-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .icon-choice { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px 7px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .icon-choice.no-icon { padding: 7px 14px; }
  .icon-choice svg { width: 18px; height: 18px; flex-shrink: 0; }
  .icon-choice.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .icon-choice-add { border: 1.5px dashed var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--ink-faint); cursor: pointer; }
  .icon-choice-add:hover { color: var(--accent-ink); border-color: var(--accent); }

  .food-tree { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 8px; background: var(--bg); }
  details.food-cat-details summary, details.food-sub-details summary { cursor: pointer; list-style: none; }
  details.food-cat-details summary::-webkit-details-marker, details.food-sub-details summary::-webkit-details-marker { display: none; }
  details.food-cat-details summary { font-weight: 800; font-size: 12.5px; padding: 7px 4px; display: flex; align-items: center; gap: 6px; }
  details.food-cat-details { margin-bottom: 4px; }
  details.food-cat-details summary::before { content: "▸"; color: var(--ink-faint); font-size: 10px; transition: transform .15s; display: inline-block; }
  details.food-cat-details[open] > summary::before { transform: rotate(90deg); }
  details.food-sub-details { margin: 2px 0 6px 14px; }
  details.food-sub-details summary { font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 5px 4px; display: flex; align-items: center; gap: 6px; }
  details.food-sub-details summary::before { content: "▸"; color: var(--ink-faint); font-size: 9px; transition: transform .15s; display: inline-block; }
  details.food-sub-details[open] > summary::before { transform: rotate(90deg); }
  .food-option-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 6px 14px; }
  .food-option { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px 5px 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .food-option svg { width: 20px; height: 20px; flex-shrink: 0; }
  .food-option.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

  .weight-list { margin-top: 10px; }
  .weight-row { display: grid; grid-template-columns: 22px 1fr 80px 92px 24px; align-items: center; column-gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .weight-row:last-child { border-bottom: none; }
  .weight-row svg { width: 22px; height: 22px; }
  .weight-row-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .weight-row input.weight-input { width: 80px; height: 38px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: 13px; background: var(--bg); color: var(--ink); }
  .weight-row select.unit-select { width: 92px; height: 38px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 0 22px 0 8px; line-height: normal; font-size: 12.5px; color: var(--ink); background-color: var(--bg); -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 12px) center, calc(100% - 8px) center; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  .weight-remove { border: none; background: var(--surface-2); width: 24px; height: 24px; border-radius: 50%; color: var(--ink-soft); cursor: pointer; font-size: 12px; }
  .manage-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .manage-row:last-child { border-bottom: none; }

  .photo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .photo-thumb { position: relative; width: 62px; height: 62px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .rm { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 11px; cursor: pointer; line-height: 1; }
  .photo-add-label { width: 62px; height: 62px; border-radius: var(--radius-sm); border: 1.5px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .field-hint { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* ---------- Trial table ---------- */
  details.category-block { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; transition: none; interpolate-size: normal; }
  details.category-block > *, details.sub-block > * { transition: none; }
  details.category-block summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  details.category-block summary::-webkit-details-marker { display: none; }
  .cat-summary-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; }
  .cat-caret { transition: transform .15s; color: var(--ink-faint); font-size: 12px; display: inline-block; }
  details[open] > summary .cat-caret { transform: rotate(90deg); }
  .cat-progress-pill { font-size: 12px; font-weight: 800; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; }

  var STORE_KEY = "bbFoodApp_v2";

  /* ============ State ============ */
  var state = null;

  function freshState() { return { babies: [], activeBabyId: null, perBaby: {} }; }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return freshState();
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.babies) return freshState();
      return parsed;
    } catch (e) { return freshState(); }
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn("儲存失敗,可能是瀏覽器容量已滿", e); }
    pushStateToCloud();
  }

  /* ============ 雲端共享(房號)============
     每個「房號」對應 Firestore 裡:
       rooms/{code}            → 基本資料(寶寶清單、自訂項目、設定…不含照片)
       rooms/{code}/entries/*  → 每一筆紀錄各自一份文件(含照片),避免單一文件超過 Firestore 1MB 上限
     沒有房號的訪客會自動建立一個只屬於自己的新房號(不影響任何人),
     要跟別人共用資料,就是把房號告訴對方,對方在「分享/共用」選單裡輸入加入。
  */
  var ROOM_KEY = "bbFoodApp_room";
  var cloudEnabled = !!(window.firebase && firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("YOUR_") !== 0);
  var db = null;
  if (cloudEnabled) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
  var roomCode = null;
  var roomRef = null;
  var unsubscribeRoom = null;
  var unsubscribeEntries = null;
  var applyingRemoteUpdate = false;
  var cloudSaveTimer = null;
  var roomStatus = "offline"; // offline | connecting | synced | error
  var lastPushedEntries = null; // entryId -> entry(含 babyId),用來跟下次存檔比對差異

  function makeRoomCode() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 避開容易混淆的 0/O/1/I
    var s = "";
    for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function normalizeRoomCode(raw) {
    return (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  }
  function roomDocRef(code) { return db.collection("rooms").doc(code); }

  // 把 state 拆成「基本資料(meta)」跟「攤平的紀錄陣列(entries,各自帶 babyId)」
  function splitStateForCloud(s) {
    var meta = { babies: s.babies, activeBabyId: s.activeBabyId, perBaby: {} };
    var entries = [];
    Object.keys(s.perBaby).forEach(function (babyId) {
      var bucket = s.perBaby[babyId];
      var metaBucket = {};
      Object.keys(bucket).forEach(function (k) {
        if (k !== "entries") metaBucket[k] = bucket[k];
      });
      meta.perBaby[babyId] = metaBucket;
      (bucket.entries || []).forEach(function (e) {
        var withBaby = { babyId: babyId };
        Object.keys(e).forEach(function (k) { withBaby[k] = e[k]; });
        entries.push(withBaby);
      });
    });
    return { meta: meta, entries: entries };
  }

  // 把 meta + entries 子集合的內容,合併回 app 用的 state 結構
  function mergeCloudIntoState(meta, entriesMap) {
    var s = { babies: meta.babies || [], activeBabyId: meta.activeBabyId || null, perBaby: {} };
    Object.keys(meta.perBaby || {}).forEach(function (babyId) {
      var bucket = {};
      var metaBucket = meta.perBaby[babyId];
      Object.keys(metaBucket).forEach(function (k) { bucket[k] = metaBucket[k]; });
      bucket.entries = [];
      s.perBaby[babyId] = bucket;
    });
    Object.keys(entriesMap).forEach(function (id) {
      var e = entriesMap[id];
      var bucket = s.perBaby[e.babyId];
      if (!bucket) return;
      var clean = {};
      Object.keys(e).forEach(function (k) { if (k !== "babyId") clean[k] = e[k]; });
      bucket.entries.push(clean);
    });
    return s;
  }

  // 依 500 筆一批的限制,把一堆 set/delete 操作分批 commit
  function commitInChunks(ops, size) {
    var i = 0;
    function next() {
      if (i >= ops.length) return;
      var batch = db.batch();
      ops.slice(i, i + size).forEach(function (op) {
        if (op.type === "set") batch.set(op.ref, op.data);
        else batch.delete(op.ref);
      });
      i += size;
      batch.commit().then(next).catch(function (err) { console.warn("批次寫入失敗", err); });
    }
    next();
  }

  // 比對這次的 entries 跟上次推上雲端的版本,只寫入真的有變動的那幾筆
  function pushEntriesDiff(entries) {
    var nextMap = {};
    entries.forEach(function (e) { nextMap[e.id] = e; });
    var prevMap = lastPushedEntries || {};
    var ops = [];
    Object.keys(nextMap).forEach(function (id) {
      var e = nextMap[id];
      var prevJSON = prevMap[id] ? JSON.stringify(prevMap[id]) : null;
      if (prevJSON !== JSON.stringify(e)) {
        ops.push({ type: "set", ref: roomRef.collection("entries").doc(id), data: e });
      }
    });
    Object.keys(prevMap).forEach(function (id) {
      if (!nextMap[id]) ops.push({ type: "delete", ref: roomRef.collection("entries").doc(id) });
    });
    lastPushedEntries = nextMap;
    if (ops.length) commitInChunks(ops, 400);
  }

  function startListening(code) {
    if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
    if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }
    roomRef = roomDocRef(code);
    var remoteMeta = null, remoteEntriesMap = null;

    function applyRemoteIfReady() {
      if (!remoteMeta || !remoteEntriesMap) return;
      roomStatus = "synced";
      updateSyncUI();
      applyingRemoteUpdate = true;
      state = mergeCloudIntoState(remoteMeta, remoteEntriesMap);
      lastPushedEntries = remoteEntriesMap;
      if (state.activeBabyId) ensureBabyBucket(state.activeBabyId);
      renderAll();
      applyingRemoteUpdate = false;
    }
    function onError(err) {
      console.warn("同步失敗", err);
      roomStatus = "error";
      updateSyncUI();
    }

    unsubscribeRoom = roomRef.onSnapshot(function (doc) {
      var data = doc.data();
      if (!data || !data.meta) return;
      remoteMeta = data.meta;
      applyRemoteIfReady();
    }, onError);

    unsubscribeEntries = roomRef.collection("entries").onSnapshot(function (snap) {
      var map = {};
      snap.forEach(function (d) { map[d.id] = d.data(); });
      remoteEntriesMap = map;
      applyRemoteIfReady();
    }, onError);
  }

  function connectAsOwner(code) {
    roomStatus = "connecting";
    updateSyncUI();
    roomRef = roomDocRef(code); // 提前設定,讓下面的 pushEntriesDiff 拿得到 roomRef
    roomRef.get().then(function (doc) {
      roomCode = code;
      localStorage.setItem(ROOM_KEY, code);
      if (!doc.exists) {
        // 全新房號:用這台裝置現有的資料當作起點
        lastPushedEntries = {};
        var split = splitStateForCloud(state);
        return roomRef.set({ meta: split.meta, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
          .then(function () { pushEntriesDiff(split.entries); });
      }
    }).then(function () {
      startListening(code);
    }).catch(function (err) {
      console.warn("建立/連線房號失敗", err);
      roomStatus = "error";
      updateSyncUI();
    });
  }

  function joinRoom(code, onDone) {
    roomDocRef(code).get().then(function (doc) {
      if (!doc.exists) {
        onDone && onDone("找不到這個代碼,請確認代碼是否正確。");
        return;
      }
      roomCode = code;
      localStorage.setItem(ROOM_KEY, code);
      startListening(code);
      onDone && onDone(null);
    }).catch(function (err) {
      console.warn("加入房號失敗", err);
      onDone && onDone("連線失敗,請稍後再試。");
    });
  }

  function pushStateToCloud() {
    if (!cloudEnabled || !roomRef || applyingRemoteUpdate) return;
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function () {
      var split = splitStateForCloud(state);
      roomRef.set({ meta: split.meta, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
        .catch(function (err) { console.warn("雲端儲存失敗(基本資料)", err); });
      pushEntriesDiff(split.entries);
    }, 600);
  }

  function initRoomSync() {
    if (!cloudEnabled) return;
    var saved = localStorage.getItem(ROOM_KEY);
    if (saved) {
      connectAsOwner(saved);
    } else {

    }
  }

  function activeData() {
    if (!state.activeBabyId) return null;
    return state.perBaby[state.activeBabyId];
  }
  function ensureBabyBucket(id) {
    if (!state.perBaby[id]) {
      state.perBaby[id] = { entries: [], customLove: [], customTexture: [], customAllergy: [], customUnit: [], customFoods: {}, hiddenFoods: [], hiddenUnits: [], unitOrder: [], foodOverrides: {}, manualTried: {}, manualAllergy: {}, priorityOverride: {}, foodOrder: {} };
    }
    var b = state.perBaby[id];
    if (!b.hiddenFoods) b.hiddenFoods = [];
    if (!b.foodOverrides) b.foodOverrides = {};
    if (!b.manualTried) b.manualTried = {};
    if (!b.manualAllergy) b.manualAllergy = {};
    if (!b.priorityOverride) b.priorityOverride = {};
    if (!b.foodOrder) b.foodOrder = {};
    if (!b.customUnit) b.customUnit = [];
    if (!b.hiddenUnits) b.hiddenUnits = [];
    if (!b.unitOrder) b.unitOrder = [];
    b.entries.forEach(function (e) {
      if (!e.allergyIds) {
        e.allergyIds = (e.allergyId && e.allergyId !== "al_none") ? [e.allergyId] : [];
        delete e.allergyId;
      }
    });
  }

  /* ============ Utils ============ */
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function parseYMD(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function formatYMD(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayStr() { return formatYMD(new Date()); }
  function addDaysStr(s, n) { var d = parseYMD(s); d.setDate(d.getDate() + n); return formatYMD(d); }
  function addMonthsStr(s, n) { var d = parseYMD(s); d.setDate(1); d.setMonth(d.getMonth() + n); return formatYMD(d); }
  var DOW = ["日", "一", "二", "三", "四", "五", "六"];
  function fmtDisplayDate(s) { var d = parseYMD(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function allFoods() {
    var d = activeData();
    var merged = {};
    Object.keys(FOODS).forEach(function (k) {
      if (d && d.hiddenFoods && d.hiddenFoods.indexOf(k) !== -1) return;
      var f = FOODS[k];
      if (d && d.foodOverrides && d.foodOverrides[k]) {
        f = { name: f.name, icon: f.icon, cat: d.foodOverrides[k].cat, sub: d.foodOverrides[k].sub };
      }
      merged[k] = f;
    });
    if (d) Object.keys(d.customFoods).forEach(function (k) { merged[k] = d.customFoods[k]; });
    return merged;
  }
  function isDefaultFood(fid) { return Object.prototype.hasOwnProperty.call(FOODS, fid); }
  function loveOptions() { var d = activeData(); return DEFAULT_LOVE.concat(d ? d.customLove : []); }
  function textureOptions() { var d = activeData(); return DEFAULT_TEXTURE.concat(d ? d.customTexture : []); }
  function allergyOptions() { var d = activeData(); return DEFAULT_ALLERGY.concat(d ? d.customAllergy : []); }
  function orderUnits(d, list) {
    var order = (d && d.unitOrder) || [];
    var known = order.map(function (id) { return list.find(function (u) { return u.id === id; }); }).filter(Boolean);
    var rest = list.filter(function (u) { return order.indexOf(u.id) === -1; });
    return known.concat(rest);
  }
  function unitOptions() {
    var d = activeData();
    if (!d) return DEFAULT_UNIT;
    var all = DEFAULT_UNIT.concat(d.customUnit || []);
    var hidden = d.hiddenUnits || [];
    var visible = all.filter(function (u) { return hidden.indexOf(u.id) === -1; });
    return orderUnits(d, visible);
  }
  function allUnitsForManage(d) {
    var all = DEFAULT_UNIT.concat(d.customUnit || []);
    var hidden = d.hiddenUnits || [];
    return orderUnits(d, all).map(function (u) {
      var isCustom = (d.customUnit || []).some(function (c) { return c.id === u.id; });
      return { id: u.id, label: u.label, isCustom: isCustom, hidden: hidden.indexOf(u.id) !== -1 };
    });
  }
  function foodAmountUnit(sf) {
    return { amount: sf.amount != null ? sf.amount : sf.weightG, unit: sf.unit || "unit_g" };
  }
  function defaultUnitId() {
    var opts = unitOptions();
    return (opts[0] && opts[0].id) || "unit_g";
  }

  function computeAge(birthdate) {
    if (!birthdate) return "—";
    var b = parseYMD(birthdate), t = new Date();
    if (b > t) return "尚未出生";
    var months = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
    var ref = new Date(b.getFullYear(), b.getMonth() + months, b.getDate());
    if (ref > t) { months -= 1; ref = new Date(b.getFullYear(), b.getMonth() + months, b.getDate()); }
    var days = Math.floor((t - ref) / 86400000);
    return months + " 個月又 " + days + " 天大";
  }

  /* ============ Modal stack ============ */
  var modalRoot = document.createElement("div");
  document.body.appendChild(modalRoot);
  var modalStack = [];
  function openModal(innerHTML, opts) {
    opts = opts || {};
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.style.zIndex = 100 + modalStack.length;
    overlay.innerHTML =
      '<div class="modal-box' + (opts.wide ? " wide" : "") + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div class="modal-title">' + escapeHtml(opts.title || "") + "</div>" +
      (opts.forceOpen ? "" : '<button class="modal-close" type="button" data-close-modal aria-label="關閉">✕</button>') +
      "</div>" +
      '<div class="modal-body">' + innerHTML + "</div></div>";
    modalRoot.appendChild(overlay);
    modalStack.push(overlay);
    if (!opts.forceOpen) {
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeTopModal(); });
      overlay.querySelector("[data-close-modal]").addEventListener("click", closeTopModal);
    }
    return overlay;
  }
  function closeTopModal() { var el = modalStack.pop(); if (el) el.remove(); }

  function showMessage(text) {
    var overlay = openModal(
      '<div style="white-space:pre-wrap;">' + escapeHtml(text) + '</div>' +

    );

    var confirmBtn = '<button class="btn btn-primary" type="button" data-confirm>確定</button>';

    );
    overlay.querySelector("[data-cancel]").addEventListener("click", closeTopModal);
    overlay.querySelector("[data-confirm]").addEventListener("click", function () { closeTopModal(); onConfirm(); });
  }

      });

  function buildTourOverlay() {
    var div = document.createElement("div");
    div.className = "tour-overlay";

    div.innerHTML =
      '<div class="tour-spotlight" id="tourSpotlight"></div>' +

      '<button type="button" id="tourNextBtn" class="btn btn-primary btn-sm">下一步</button>' +
      "</div></div>";
    document.body.appendChild(div);
    document.getElementById("tourSkipBtn").addEventListener("click", endTour);
    document.getElementById("tourPrevBtn").addEventListener("click", function () { showTourStep(tourStepIndex - 1); });
    document.getElementById("tourNextBtn").addEventListener("click", function () {
      if (tourStepIndex >= TOUR_STEPS.length - 1) endTour(); else showTourStep(tourStepIndex + 1);
    });
    window.addEventListener("resize", function () {
      if (!tourOverlayEl || tourOverlayEl.style.display === "none") return;
      var step = TOUR_STEPS[tourStepIndex];
      var target = document.querySelector(step.selector);
      if (target) positionTourElements(target);
    });
    return div;
  }

  function positionTourElements(target) {
    var rect = target.getBoundingClientRect();
    var pad = 8;
    var spotlight = document.getElementById("tourSpotlight");
    spotlight.style.top = Math.max(0, rect.top - pad) + "px";
    spotlight.style.left = Math.max(0, rect.left - pad) + "px";
    spotlight.style.width = (rect.width + pad * 2) + "px";
    spotlight.style.height = (rect.height + pad * 2) + "px";

    var tooltip = document.getElementById("tourTooltip");
    var tw = tooltip.offsetWidth || 320;
    var th = tooltip.offsetHeight || 160;
    var vw = window.innerWidth, vh = window.innerHeight;
    var top;
    if (rect.bottom + pad + th + 16 < vh) top = rect.bottom + pad + 14;
    else if (rect.top - pad - th - 16 > 0) top = rect.top - pad - th - 14;
    else top = Math.max(12, (vh - th) / 2);
    var left = rect.left;
    if (left + tw + 12 > vw) left = vw - tw - 12;
    if (left < 12) left = 12;
    tooltip.style.top = Math.max(12, top) + "px";
    tooltip.style.left = left + "px";
  }

  function showTourStep(idx) {
    if (idx < 0) return;
    if (idx >= TOUR_STEPS.length) { endTour(); return; }
    var step = TOUR_STEPS[idx];
    var modalOpen = !!document.getElementById("entryDate");
    if (step.needsEntryModal) {
      if (!modalOpen) openEntryModal(todayStr(), null);
    } else if (modalOpen) {
      closeTopModal();
    }
    tourStepIndex = idx;
    if (step.tab) showTab(step.tab);
    if (step.beforeShow) step.beforeShow();
    document.getElementById("tourStepCounter").textContent = (idx + 1) + " / " + TOUR_STEPS.length;
    document.getElementById("tourTitle").textContent = step.title;
    document.getElementById("tourText").innerHTML = step.text;
    document.getElementById("tourPrevBtn").style.visibility = idx === 0 ? "hidden" : "visible";
    document.getElementById("tourNextBtn").textContent = idx === TOUR_STEPS.length - 1 ? "完成" : "下一步";
    var target = document.querySelector(step.selector);
    if (!target) {
      if (idx < TOUR_STEPS.length - 1) showTourStep(idx + 1); else endTour();
      return;
    }
    target.scrollIntoView({ block: "center" });
    requestAnimationFrame(function () { positionTourElements(target); });
  }

  var calView = "week";

  function calRangeDates() {
    var d = parseYMD(calAnchor);
    d.setDate(d.getDate() - d.getDay());
    var out = [];
    for (var i = 0; i < 7; i++) { out.push(formatYMD(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  function monthGridDates() {
    var d = parseYMD(calAnchor);
    var first = new Date(d.getFullYear(), d.getMonth(), 1);
    var gridStart = new Date(first); gridStart.setDate(1 - first.getDay());
    var out = [];
    for (var i = 0; i < 42; i++) { var dt = new Date(gridStart); dt.setDate(gridStart.getDate() + i); out.push(formatYMD(dt)); }
    return out;
  }
  function calLabelText() {
    var d = parseYMD(calAnchor);
    if (calView === "month") return d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
    var dates = calRangeDates();
    var a = parseYMD(dates[0]), b = parseYMD(dates[6]);
    return (a.getMonth() + 1) + "/" + a.getDate() + " – " + (b.getMonth() + 1) + "/" + b.getDate();
  }
  function calNav(dir) {
    if (calView === "week") calAnchor = addDaysStr(calAnchor, dir * 7);
    else calAnchor = addMonthsStr(calAnchor, dir);

    document.getElementById("monthDowRow").innerHTML = DOW.map(function (w) { return '<div class="month-dow">週' + w + "</div>"; }).join("");

  var pendingPhotos = [];
  function compressImage(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 640;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = function () { resolve(null); };
        img.src = ev.target.result;
      };
      reader.onerror = function () { resolve(null); };
      reader.readAsDataURL(file);
    });
  }

            if (alreadySelected) {
              arr = arr.filter(function (v) { return v !== val; });
            } else if (val === "al_none") {

              arr = arr.filter(function (v) { return v !== "al_none"; }).concat([val]);

            group.querySelectorAll(".icon-choice").forEach(function (o) {
              o.classList.toggle("selected", arr.indexOf(o.getAttribute("data-value")) !== -1);
            });
          } else {
            state_selected[field] = alreadySelected ? null : opt.getAttribute("data-value");
            group.querySelectorAll(".icon-choice").forEach(function (o) { o.classList.toggle("selected", !alreadySelected && o === opt); });
          }
          return;

        var addBtn = e.target.closest("[data-add-custom]");

            if (isMulti) {
              state_selected.allergy = (state_selected.allergy || []).filter(function (v) { return v !== "al_none"; }).concat([newId]);
              group.outerHTML = buildChoiceGroupHTML(kind, optsList, state_selected.allergy);
            } else {
              state_selected[kind === "love" ? "love" : "tex"] = newId;
              group.outerHTML = buildChoiceGroupHTML(kind, optsList, newId);
            }
            bindChoiceGroup(kind);
          });
        }
      });
    }
    ["love", "texture", "allergy"].forEach(bindChoiceGroup);

    if (existingEntry) {
      overlay.querySelector("#entryDelete").addEventListener("click", function () {
        var d = activeData();
        d.entries = d.entries.filter(function (e) { return e.id !== existingEntry.id; });
        saveState(); closeTopModal();
        renderCalendar(); renderTrial(); renderDashboard();
      });
    }

    overlay.querySelector("#entrySave").addEventListener("click", function () {
      if (!selectedFoods.length) { showMessage("請選擇食材"); return; }
      var d = activeData();
      var payload = {
        id: existingEntry ? existingEntry.id : "entry_" + uid(),
        date: overlay.querySelector("#entryDate").value || dateStr,
        foods: selectedFoods.map(function (f) { return { foodId: f.foodId, amount: f.amount, unit: f.unit }; }),
        loveId: state_selected.love,

        note: overlay.querySelector("#entryNote").value.trim(),

        createdAt: existingEntry ? existingEntry.createdAt : Date.now()
      };
      if (existingEntry) {
        var idx = d.entries.findIndex(function (e) { return e.id === existingEntry.id; });

  /* ============ Trial table ============ */
  function entryAllergyIds(e) {
    if (e.allergyIds) return e.allergyIds;
    return (e.allergyId && e.allergyId !== "al_none") ? [e.allergyId] : [];
  }
  function foodTriedEntries(d, fid) { return d.entries.filter(function (e) { return e.foods.some(function (sf) { return sf.foodId === fid; }); }); }
  function foodTriedInfo(d, fid) {
    var entries = foodTriedEntries(d, fid);
    var fromEntries = entries.length > 0;
    var manual = !!(d.manualTried && d.manualTried[fid]);
    var firstDate = fromEntries ? entries.reduce(function (min, e) { return e.date < min ? e.date : min; }, entries[0].date) : null;
    return { tried: fromEntries || manual, fromEntries: fromEntries, manual: manual, firstDate: firstDate, count: entries.length };
  }
  function foodAllergyIds(d, fid) {
    var ids = {};
    foodTriedEntries(d, fid).forEach(function (e) { entryAllergyIds(e).forEach(function (aid) { if (aid && aid !== "al_none") ids[aid] = true; }); });
    if (d.manualAllergy && d.manualAllergy[fid] && d.manualAllergy[fid] !== "al_none") ids[d.manualAllergy[fid]] = true;
    return Object.keys(ids);
  }

  function pctLabel(num, den) {
    if (!den) return "0%";
    return Math.round((num / den) * 100) + "%";
  }
  var PRIORITY_LABEL = { 1: "常見", 2: "一般", 3: "罕見" };
  var activePriorityFilter = ["all"];
  function foodPriority(d, fid, foods) {
    var override = d && d.priorityOverride && d.priorityOverride[fid];
    if (override) return override;
    var f = (foods || allFoods())[fid];
    return (f && f.priority) || 2;
  }
  function passesPriorityFilter(d, fid, foods) {
    return activePriorityFilter.indexOf("all") !== -1 || activePriorityFilter.indexOf(foodPriority(d, fid, foods)) !== -1;
  }
  function getOrderedFoodIds(d, subKey, idsUnordered) {
    var order = (d.foodOrder && d.foodOrder[subKey]) || [];
    var orderedKnown = order.filter(function (fid) { return idsUnordered.indexOf(fid) !== -1; });
    var rest = idsUnordered.filter(function (fid) { return orderedKnown.indexOf(fid) === -1; });
    return orderedKnown.concat(rest);
  }
  function togglePriorityFilter(v) {
    if (v === "all") {
      activePriorityFilter = ["all"];
      return;
    }
    var num = Number(v);
    if (activePriorityFilter.indexOf("all") !== -1) activePriorityFilter = [];
    var pos = activePriorityFilter.indexOf(num);
    if (pos !== -1) activePriorityFilter.splice(pos, 1); else activePriorityFilter.push(num);
    if (!activePriorityFilter.length) activePriorityFilter = ["all"];
  }
  function bindPriorityFilterBar(bar) {
    if (!bar) return;
    bar.querySelectorAll("[data-priority-filter]").forEach(function (btn) {
      var v = btn.getAttribute("data-priority-filter");
      var isActive = v === "all" ? activePriorityFilter.indexOf("all") !== -1 : activePriorityFilter.indexOf(Number(v)) !== -1;
      btn.classList.toggle("active", isActive);
      btn.addEventListener("click", function () {
        togglePriorityFilter(v);
        renderTrial(); renderDashboard();
      });
    });
  }
  function priorityFilterBarHTML() {
    return '<div class="priority-filter-bar" title="依食材常見度篩選要顯示的範圍(可複選)"><span class="priority-filter-label"><svg><use href="#ic-filter"></use></svg>常見度篩選</span>' +
      ["all", 1, 2, 3].map(function (v) {
        var label = v === "all" ? "全部" : PRIORITY_LABEL[v];
        var isActive = v === "all" ? activePriorityFilter.indexOf("all") !== -1 : activePriorityFilter.indexOf(v) !== -1;
        return '<button type="button" class="priority-filter-btn' + (isActive ? " active" : "") + '" data-priority-filter="' + v + '">' + label + "</button>";
      }).join("") + "</div>";
  }

  function buildAllergyLegendHTML() {
    var opts = allergyOptions().filter(function (o) { return o.id !== "al_none"; });
    return '<div class="allergy-legend">' + opts.map(function (o) {

  function toggleManualTried(fid) {

  function openMoveFoodModal(fid) {

    var html = '<div class="field"><div class="field-label">大分類</div><select id="moveCat">' + catOptions + "</select></div>" +

    function refreshSubOptions() {

  function confirmDeleteFood(fid) {

    var f = foods[fid];
    openConfirmModal("確定要從食材清單移除「" + f.name + "」嗎?已經記錄的相關紀錄也會一併調整,無法復原。", function () {

        delete d.manualTried[fid];

  function openFoodRowMenu(fid) {
    var foods = allFoods();
    var f = foods[fid];
    var html = '<div class="baby-dropdown-action" data-row-action="move"><svg><use href="#ic-move"></use></svg><span>移動分類</span></div>' +
      '<div class="baby-dropdown-action" data-row-action="delete" style="color:var(--danger);"><svg><use href="#ic-trash"></use></svg><span>刪除此食材</span></div>';

    overlay.querySelector('[data-row-action="delete"]').addEventListener("click", function () { closeTopModal(); confirmDeleteFood(fid); });

  function openSubCategoryPreviewModal(catId, subId) {
    var d = activeData();
    var foods = allFoods();
    var cat = CATEGORIES.find(function (c) { return c.id === catId; });
    var sub = cat.subs.find(function (s) { return s.id === subId; });
    var allFoodIds = Object.keys(foods);
    var filteredFoodIds = allFoodIds.filter(function (fid) { return foods[fid].cat === catId && foods[fid].sub === subId && passesPriorityFilter(d, fid, foods); });
    var globalMaxCount = Math.max.apply(null, filteredFoodIds.map(function (fid) { return foodTriedEntries(d, fid).length; }).concat([1]));
    var allOpts = allergyOptions();
    var subKey = "sub_" + catId + "_" + subId;
    var subFoodIds = getOrderedFoodIds(d, subKey, filteredFoodIds);
    var rows = subFoodIds.map(function (fid) {
      var f = foods[fid];
      var info = foodTriedInfo(d, fid);
      var pct = globalMaxCount ? Math.round(info.count / globalMaxCount * 100) : 0;
      var dateLabel = info.fromEntries ? info.firstDate : (info.manual ? "手動標記" : "尚未嘗試");
      var allergyIds = foodAllergyIds(d, fid);
      var allergyIconsHtml = allergyIds.length
        ? allergyIds.map(function (aid) { var o = allOpts.find(function (x) { return x.id === aid; }); return o ? '<svg style="color:' + toneColorVar(o.tone) + '"><use href="#' + o.icon + '"></use></svg>' : ""; }).join("")
        : '<span class="trial-allergy-none">—</span>';
      return "<tr><td><div class=\"trial-food-name\" style=\"grid-template-columns:26px 1fr;\"><svg><use href=\"#" + f.icon + "\"></use></svg>" +
        '<span class="trial-food-label">' + escapeHtml(f.name) + "</span></div></td>" +
        '<td><span class="trial-check' + (info.tried ? " checked" : "") + '">' + (info.tried ? "✓" : "") + "</span></td>" +
        '<td class="trial-date' + (info.tried ? "" : " empty") + '">' + dateLabel + "</td>" +
        '<td><div class="trial-allergy-cell" style="cursor:default;">' + allergyIconsHtml + "</div></td>" +
        '<td><div class="trial-count-cell"><div class="trial-count-track"><div class="trial-count-fill" style="width:' + pct + '%"></div></div><span class="trial-count-num">' + info.count + "</span></div></td></tr>";
    }).join("");
    var html = '<div class="card-sub" style="margin-bottom:10px;">唯讀檢視,如需編輯請至「食材紀錄」模組</div>' +
      '<div class="scroll-x"><table class="trial-table preview-table"><thead><tr><th>食材</th><th>已嘗試</th><th>首次嘗試日期</th><th>過敏反應</th><th>嘗試次數</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="modal-actions"><button class="btn btn-primary" type="button" data-close style="flex:1;">關閉</button></div>';
    var overlay = openModal(html, { title: cat.emoji + " " + cat.name + " · " + sub.name, wide: true });
    overlay.querySelector("[data-close]").addEventListener("click", closeTopModal);
  }

  function renderTrial() {
    var container = document.getElementById("trialContainer");
    var d = activeData();
    if (!state.activeBabyId || !d) { container.innerHTML = '<div class="card"><div class="empty-state">請先設定寶寶資料</div></div>'; return; }
    var foods = allFoods();
    var allFoodIds = Object.keys(foods);
    var globalMaxCount = Math.max.apply(null, allFoodIds.map(function (fid) { return foodTriedEntries(d, fid).length; }).concat([1]));
    var allOpts = allergyOptions();
    var dragEnabled = activePriorityFilter.length === 1 && activePriorityFilter[0] === "all";
    var openState = {};
    container.querySelectorAll("details[data-key]").forEach(function (el) { openState[el.getAttribute("data-key")] = el.open; });
    var legendEl = document.getElementById("trialAllergyLegend");
    if (legendEl) legendEl.innerHTML = buildAllergyLegendHTML();
    var filterBarEl = document.getElementById("trialPriorityFilterBar");
    if (filterBarEl) { filterBarEl.innerHTML = priorityFilterBarHTML(); bindPriorityFilterBar(filterBarEl); }
    var html = CATEGORIES.map(function (cat) {
      var catFoodIds = Object.keys(foods).filter(function (fid) { return foods[fid].cat === cat.id && passesPriorityFilter(d, fid, foods); });
      var catTried = catFoodIds.filter(function (fid) { return foodTriedInfo(d, fid).tried; }).length;
      var catKey = "cat_" + cat.id;
      var subsHTML = cat.subs.map(function (sub) {
        var subKey = "sub_" + cat.id + "_" + sub.id;
        var subFoodIds = getOrderedFoodIds(d, subKey, catFoodIds.filter(function (fid) { return foods[fid].sub === sub.id; }));
        var subTried = subFoodIds.filter(function (fid) { return foodTriedInfo(d, fid).tried; }).length;
        var rows = subFoodIds.map(function (fid) {
          var f = foods[fid];
          var info = foodTriedInfo(d, fid);
          var pct = globalMaxCount ? Math.round(info.count / globalMaxCount * 100) : 0;
          var dateLabel = info.fromEntries ? info.firstDate : (info.manual ? "手動標記" : "尚未嘗試");
          var checkClass = "trial-check" + (info.tried ? " checked" : "") + (!info.fromEntries ? " editable" : "");
          var allergyIds = foodAllergyIds(d, fid);
          var allergyIconsHtml = allergyIds.length
            ? allergyIds.map(function (aid) { var o = allOpts.find(function (x) { return x.id === aid; }); return o ? '<svg style="color:' + toneColorVar(o.tone) + '"><use href="#' + o.icon + '"></use></svg>' : ""; }).join("")
            : '<span class="trial-allergy-none">—</span>';
          var pr = foodPriority(d, fid, foods);
          return '<tr data-drag-fid="' + fid + '" data-drag-sub="' + subKey + '"' + (dragEnabled ? ' draggable="true"' : "") + '>' +
            '<td>' + (dragEnabled ? '<span class="trial-drag-handle" title="拖曳調整順序(僅限同子分類)"><svg><use href="#ic-grip"></use></svg></span>' : "") + '</td>' +
            "<td><div class=\"trial-food-name\"><svg><use href=\"#" + f.icon + "\"></use></svg>" +
            '<span class="trial-food-label">' + escapeHtml(f.name) + "</span>" +
            "</div></td>" +
            '<td><span class="trial-priority-badge p' + pr + '" data-priority-cycle="' + fid + '" title="點擊調整常見度">' + PRIORITY_LABEL[pr] + "</span></td>" +
            '<td><span class="' + checkClass + '" data-tried-toggle="' + (info.fromEntries ? "" : fid) + '">' + (info.tried ? "✓" : "") + "</span></td>" +
            '<td class="trial-date' + (info.tried ? "" : " empty") + '">' + dateLabel + "</td>" +
            '<td><div class="trial-allergy-cell" data-allergy-edit="' + fid + '">' + allergyIconsHtml + "</div></td>" +
            '<td><div class="trial-count-cell"><div class="trial-count-track"><div class="trial-count-fill" style="width:' + pct + '%"></div></div><span class="trial-count-num">' + info.count + "</span></div></td>" +
            '<td><button type="button" class="trial-row-menu" data-menu-food="' + fid + '" aria-label="更多"><svg><use href="#ic-dots-vertical"></use></svg></button></td></tr>';
        }).join("");
        return '<details class="sub-block" data-key="' + subKey + '"' + (openState[subKey] ? " open" : "") + '><summary><div class="sub-head"><span class="sub-head-label"><span class="cat-caret">▶</span>' + sub.name + '</span><span class="sub-head-count">' + subTried + " / " + subFoodIds.length + ' 已嘗試</span></div></summary>' +
          '<div class="scroll-x"><table class="trial-table"><thead><tr><th></th><th>食材</th><th>常見度</th><th>已嘗試</th><th>首次嘗試日期</th><th>過敏反應</th><th>嘗試次數</th><th>移動分類/刪除</th></tr></thead><tbody>' + rows + "</tbody></table></div></details>";
      }).join("");
      return '<details class="category-block" data-key="' + catKey + '"' + (openState[catKey] ? " open" : "") + '><summary><span class="cat-summary-left"><span class="cat-caret">▶</span>' + cat.emoji + " " + cat.name + '</span><span class="cat-progress-pill">' + catTried + " / " + catFoodIds.length + '</span></summary><div class="cat-body">' + subsHTML + "</div></details>";
    }).join("");
    container.innerHTML = html;
    container.querySelectorAll("[data-tried-toggle]").forEach(function (el) {
      var fid = el.getAttribute("data-tried-toggle");
      if (!fid) return;
      el.addEventListener("click", function () { toggleManualTried(fid); });
    });
    container.querySelectorAll("[data-allergy-edit]").forEach(function (el) {
      el.addEventListener("click", function () { openAllergyEditModal(el.getAttribute("data-allergy-edit")); });
    });
    container.querySelectorAll("[data-menu-food]").forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); openFoodRowMenu(btn.getAttribute("data-menu-food")); });
    });
    container.querySelectorAll("[data-priority-cycle]").forEach(function (badge) {
      badge.addEventListener("click", function () {
        openPriorityEditModal(badge.getAttribute("data-priority-cycle"));
      });
    });
    if (dragEnabled) {
      container.querySelectorAll("tr[data-drag-fid]").forEach(function (tr) {
        tr.addEventListener("dragstart", function () { tr.classList.add("dragging"); });
        tr.addEventListener("dragend", function () { tr.classList.remove("dragging"); });
        tr.addEventListener("dragover", function (e) {
          e.preventDefault();
          var dragging = container.querySelector("tr.dragging");
          if (!dragging || dragging === tr) return;
          if (dragging.getAttribute("data-drag-sub") !== tr.getAttribute("data-drag-sub")) return;
          var rect = tr.getBoundingClientRect();
          var before = (e.clientY - rect.top) < rect.height / 2;
          tr.parentNode.insertBefore(dragging, before ? tr : tr.nextSibling);
        });
        tr.addEventListener("drop", function (e) {
          e.preventDefault();
          var subKey = tr.getAttribute("data-drag-sub");
          var tbody = tr.parentNode;
          var newOrder = Array.prototype.map.call(tbody.querySelectorAll("tr[data-drag-fid]"), function (r) { return r.getAttribute("data-drag-fid"); });
          d.foodOrder[subKey] = newOrder;
          saveState();
        });
      });
    }
  }

  /* ============ Guide(取自 方法論.md) ============ */
  function renderGuide() {

    el.innerHTML =
      '<div class="card-title">💡 副食品試敏指南</div>' +
      '<div class="callout danger">出現紅疹/皮膚發紅、嘔吐腹瀉、腹脹脹氣明顯、哭鬧不安睡不好、呼吸急促喘鳴等情況,請暫停嘗試並諮詢醫生。</div>' +

  function ringSVG(fraction, size) {
    size = size || 92;
    var r = size >= 92 ? 38 : 22, sw = size >= 92 ? 9 : 6;
    var cx = size / 2, cy = size / 2;
    var c = 2 * Math.PI * r;
    var offset = c * (1 - fraction);
    return '<svg viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + sw + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="' + sw + '" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/></svg>';
  }
  function renderDashboard() {
    var baby = state.babies.find(function (b) { return b.id === state.activeBabyId; });
    document.getElementById("dashAvatar").textContent = baby ? initials(baby.name) : "?";
    document.getElementById("dashName").textContent = baby ? baby.name : "尚未設定寶寶";
    document.getElementById("dashAge").textContent = baby ? computeAge(baby.birthdate) : "請先在右上角設定寶寶資料";

    var d = activeData();
    var foods = allFoods();
    var ringGrid = document.getElementById("ringGrid");
    var allergyList = document.getElementById("allergyList");
    if (!d) { ringGrid.innerHTML = ""; allergyList.innerHTML = '<div class="empty-state">尚無資料</div>'; return; }

    var dashFilterBar = document.getElementById("dashPriorityFilterBar");
    if (dashFilterBar) { dashFilterBar.innerHTML = priorityFilterBarHTML(); bindPriorityFilterBar(dashFilterBar); }

    ringGrid.innerHTML = CATEGORIES.map(function (cat) {
      var ids = Object.keys(foods).filter(function (fid) { return foods[fid].cat === cat.id && passesPriorityFilter(d, fid, foods); });
      var tried = ids.filter(function (fid) { return foodTriedInfo(d, fid).tried; }).length;
      var frac = ids.length ? tried / ids.length : 0;
      var subRingsHTML = cat.subs.map(function (sub) {
        var subIds = ids.filter(function (fid) { return foods[fid].sub === sub.id; });
        var subTried = subIds.filter(function (fid) { return foodTriedInfo(d, fid).tried; }).length;
        var subFrac = subIds.length ? subTried / subIds.length : 0;
        return '<button type="button" class="sub-ring-item" data-preview-sub="' + cat.id + "|" + sub.id + '"><div class="sub-ring-visual">' + ringSVG(subFrac, 56) +
          '<div class="sub-ring-frac">' + subTried + "/" + subIds.length + '<span class="frac-pct">(' + pctLabel(subTried, subIds.length) + ')</span></div></div>' +
          '<div class="sub-ring-label">' + escapeHtml(sub.name) + "</div></button>";
      }).join("");
      return '<div class="cat-progress-frame"><div class="ring-item"><div class="ring-visual">' + ringSVG(frac, 92) +
        '<div class="ring-frac">' + tried + "/" + ids.length + '<span class="frac-pct">(' + pctLabel(tried, ids.length) + ')</span></div></div>' +
        '<div class="ring-label">' + cat.emoji + " " + cat.name + "</div></div>" +
        '<div class="cat-ring-divider"></div>' +
        '<div class="sub-ring-row">' + subRingsHTML + "</div></div>";
    }).join("");
    ringGrid.querySelectorAll("[data-preview-sub]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-preview-sub").split("|");
        openSubCategoryPreviewModal(parts[0], parts[1]);
      });
    });

    var allOpts = allergyOptions();
    var foodsBySymptom = {};
    var symptomOrder = [];
    d.entries.forEach(function (e) {
      var aids = entryAllergyIds(e).filter(function (aid) { return aid && aid !== "al_none"; });
      if (!aids.length) return;
      e.foods.forEach(function (sf) {
        var f = foods[sf.foodId] || { name: "未知食材" };
        aids.forEach(function (aid) {
          if (!foodsBySymptom[aid]) { foodsBySymptom[aid] = {}; symptomOrder.push(aid); }
          foodsBySymptom[aid][f.name] = true;
        });
      });
    });
    if (!symptomOrder.length) {
      allergyList.innerHTML = '<div class="empty-state">目前沒有記錄到過敏反應,繼續加油 💪</div>';
    } else {
      allergyList.innerHTML = symptomOrder.map(function (aid) {
        var opt = allOpts.find(function (o) { return o.id === aid; });
        var foodNames = Object.keys(foodsBySymptom[aid]);
        return '<div class="allergy-row"><span class="allergy-tag">' + escapeHtml(opt ? opt.label : "過敏") + "</span>" +
          '<span class="allergy-food-list">' + escapeHtml(foodNames.join("、")) + "</span></div>";
      }).join("");
    }
  }

  function doExport() {
    var today = new Date();
    var stamp = today.getFullYear() + pad2(today.getMonth() + 1) + pad2(today.getDate());
    var filename = "寶寶副食品紀錄_備份_" + stamp + ".json";
    var data = JSON.stringify(state, null, 2);
    var blobUrl = null;
    try { blobUrl = URL.createObjectURL(new Blob([data], { type: "application/json" })); } catch (e) {}

    function showManualExportModal() {
      var downloadLinkHtml = blobUrl
        ? '<a href="' + blobUrl + '" download="' + filename + '" class="btn btn-primary" style="display:flex;justify-content:center;text-decoration:none;margin-bottom:10px;">下載 JSON 檔案</a>'
        : "";
      var html =
        '<div class="field-hint" style="margin-bottom:8px;">按「下載 JSON 檔案」把備份存到手機的「檔案」App, 之後就能用「匯入資料」裡的「從檔案匯入」讀取; 資料量大時複製貼上容易在中途被截斷, 建議優先用下載檔案的方式備份</div>' +
        downloadLinkHtml +
        '<textarea id="exportTextarea" readonly style="width:100%; height:220px; box-sizing:border-box; font-family:ui-monospace,monospace; font-size:11px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);"></textarea>' +
        '<div class="modal-actions" style="margin-top:12px;"><button class="btn btn-ghost" type="button" data-close-export>關閉</button><button class="btn btn-primary" type="button" id="copyExportBtn" style="flex:1;">複製內容</button></div>';
      var overlay = openModal(html, { title: "匯出備份 · " + filename });
      var ta = overlay.querySelector("#exportTextarea");
      ta.value = data;
      overlay.querySelector("[data-close-export]").addEventListener("click", function () {
        if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
        closeTopModal();
      });
      var copyBtn = overlay.querySelector("#copyExportBtn");
      copyBtn.addEventListener("click", function () {
        ta.focus(); ta.select();
        function markCopied() {
          var original = "複製內容";
          copyBtn.textContent = "已複製 ✓";
          setTimeout(function () { copyBtn.textContent = original; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data).then(markCopied).catch(function () {
            try { document.execCommand("copy"); markCopied(); } catch (e) {}
          });
        } else {
          try { document.execCommand("copy"); markCopied(); } catch (e) {}
        }
      });
    }

    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: data }).catch(function (err) {
        if (err && err.code === "declined") return;
        showManualExportModal();
      });
      return;
    }

    showManualExportModal();
  }

  function mergeArraysById(a, b) {
    var seen = {};
    var result = [];
    (a || []).concat(b || []).forEach(function (item) {
      if (item && item.id && !seen[item.id]) { seen[item.id] = true; result.push(item); }
    });
    return result;
  }
  function mergeObjPreferA(a, b) {
    var out = {};
    Object.keys(b || {}).forEach(function (k) { out[k] = b[k]; });
    Object.keys(a || {}).forEach(function (k) { out[k] = a[k]; });
    return out;
  }
  function mergeIdArrayUnion(a, b) {
    var seen = {}, out = [];
    (a || []).concat(b || []).forEach(function (id) { if (!seen[id]) { seen[id] = true; out.push(id); } });
    return out;
  }
  function mergeBucket(a, b) {
    if (!a) return b;
    if (!b) return a;
    var customFoods = {};
    Object.keys(a.customFoods || {}).forEach(function (k) { customFoods[k] = a.customFoods[k]; });
    Object.keys(b.customFoods || {}).forEach(function (k) { if (!customFoods[k]) customFoods[k] = b.customFoods[k]; });
    return {
      entries: mergeArraysById(a.entries, b.entries),
      customLove: mergeArraysById(a.customLove, b.customLove),
      customTexture: mergeArraysById(a.customTexture, b.customTexture),
      customAllergy: mergeArraysById(a.customAllergy, b.customAllergy),
      customUnit: mergeArraysById(a.customUnit, b.customUnit),
      customFoods: customFoods,
      hiddenFoods: mergeIdArrayUnion(a.hiddenFoods, b.hiddenFoods),
      hiddenUnits: mergeIdArrayUnion(a.hiddenUnits, b.hiddenUnits),
      unitOrder: (a.unitOrder && a.unitOrder.length) ? a.unitOrder : (b.unitOrder || []),
      foodOverrides: mergeObjPreferA(a.foodOverrides, b.foodOverrides),
      manualTried: mergeObjPreferA(a.manualTried, b.manualTried),
      manualAllergy: mergeObjPreferA(a.manualAllergy, b.manualAllergy),
      priorityOverride: mergeObjPreferA(a.priorityOverride, b.priorityOverride),
      foodOrder: mergeObjPreferA(a.foodOrder, b.foodOrder)
    };
  }
  function mergeState(current, imported) {
    var babies = mergeArraysById(current.babies, imported.babies);
    var perBaby = {};
    babies.forEach(function (baby) {
      perBaby[baby.id] = mergeBucket(current.perBaby[baby.id], imported.perBaby[baby.id]);
    });
    return { babies: babies, activeBabyId: current.activeBabyId || imported.activeBabyId, perBaby: perBaby };
  }

  function openImportModal() {

      '<textarea id="importTextarea" placeholder="貼上備份內容" style="width:100%; height:160px; box-sizing:border-box; font-family:ui-monospace,monospace; font-size:11px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);"></textarea>' +
      '<div class="modal-actions" style="margin-top:12px;"><button class="btn btn-ghost" type="button" data-close-import>取消</button><button class="btn btn-primary" type="button" id="importTextBtn" style="flex:1;">匯入貼上的內容</button></div>';
    var overlay = openModal(html, { title: "匯入資料" });

  function applyImportedJSON(text) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (err) { showMessage("匯入失敗:內容不是有效的 JSON。"); return; }
    if (!parsed || !Array.isArray(parsed.babies) || !parsed.perBaby) {
      showMessage("匯入失敗:這不是本應用程式的備份內容。");
      return;
    }
    showConfirm("將把備份內容與這台裝置現有的資料合併(不會刪除這台裝置獨有的寶寶或紀錄),確定要繼續嗎?", function () {
      state = mergeState(state, parsed);
      saveState();
      renderAll();
      showMessage("合併匯入完成!");
    });
  }

  document.getElementById("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    e.target.value = "";
    if (!file) { showMessage("匯入失敗:沒有偵測到選取的檔案。"); return; }
    var reader = new FileReader();
    reader.onerror = function () {
      showMessage("匯入失敗:讀取檔案時發生錯誤(" + (reader.error ? reader.error.name : "未知原因") + ")。");
    };
    reader.onload = function () { applyImportedJSON(reader.result); };
    reader.readAsText(file);
  });

  });
  document.getElementById("resetFoodPriority").addEventListener("click", function () {
    showConfirm("確定要恢復所有食材的原始常見度嗎?這會清除您手動調整過的常見度,此動作無法復原。", function () {
      var d = activeData();
      if (!d) return;
      d.priorityOverride = {};
      saveState(); renderTrial(); renderDashboard();
    }, { confirmFirst: true });
  });

  /* ============ Init ============ */
  state = loadState();
  if (!state.activeBabyId || !state.babies.length) {
    renderAll();
    openBabyForm(null, true);
  } else {
    ensureBabyBucket(state.activeBabyId);
    renderAll();
  }
  updateSyncUI();
  initRoomSync();
})();
</script>
